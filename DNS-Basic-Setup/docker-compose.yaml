services:
  bind9:
    image: ubuntu/bind9:latest
    container_name: bind9
    environment:
      - BIND9_USER=root
      - TZ=Asia/Jakarta
    ports:
      - "1053:53/tcp"
      - "1053:53/udp"
    volumes:
      - ./config/named.conf.local:/etc/bind/named.conf.local:ro
      - ./zones:/etc/bind/zones:ro
    restart: unless-stopped