
services:
  api:
    build: ./api
    container_name: todo-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/todos
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    container_name: todo-mongo
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
