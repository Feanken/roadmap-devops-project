server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # NOTE: add_header in a location block replaces the headers inherited from
    # the server block, so the security headers are included in every block.
    include /etc/nginx/snippets/security-headers.conf;

    # App shell: always revalidate (ETag), so a new deploy shows up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Not in nginx's default mime.types, so it would be sent as octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The service worker must never be served stale.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Images rarely change.
    location ~* \.(png|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
