name: Pomodoro Timer CI

on:
  push:
    paths:
      - 'Pomodoro-Timer/**'
      - '.github/workflows/pomodoro-ci.yml'
  pull_request:
    paths:
      - 'Pomodoro-Timer/**'
      - '.github/workflows/pomodoro-ci.yml'

defaults:
  run:
    working-directory: Pomodoro-Timer

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks (ids, imports, offline cache, CSP rules, layers)
        run: npm run check
      - name: Unit tests
        run: npm test

  e2e:
    name: Docker build + browser e2e
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build image
        run: docker build -t lofi-pomodoro .

      - name: Run container
        run: |
          docker run -d --name app -p 8080:8080 lofi-pomodoro
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 1
          done
          docker logs app
          exit 1

      - name: Security headers are served
        run: |
          headers=$(curl -fsSI http://127.0.0.1:8080/)
          echo "$headers"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          curl -fsSI http://127.0.0.1:8080/manifest.webmanifest | grep -qi 'content-type: application/manifest+json'

      - name: Browser end-to-end test
        env:
          E2E_URL: http://127.0.0.1:8080/
          CHROME_PATH: /usr/bin/google-chrome
          E2E_OUT: ${{ runner.temp }}/e2e
        run: npm run test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e/*.png
          if-no-files-found: ignore
